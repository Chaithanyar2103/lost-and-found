---
- name: Configure Lost and Found server
  hosts: lost_found
  become: true

  pre_tasks:
    - name: Load role defaults (needed before the role runs)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/roles/lost_found/defaults/main.yml"

    - name: Check that the application JAR exists
      ansible.builtin.stat:
        path: "{{ jar_src }}"
      delegate_to: localhost
      become: false
      register: jar_stat

    - name: Fail if the JAR is missing
      ansible.builtin.fail:
        msg: "JAR not found at {{ jar_src }}. Run ./mvnw clean package first."
      when: not jar_stat.stat.exists

  roles:
    - lost_found

  post_tasks:
    - name: Wait for the health endpoint to return 200
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/actuator/health"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 10
      delay: 5
